name: Feature request
description: Suggest a concrete SDK improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is difficult or unsupported?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example API or workflow and relevant compatibility constraints.
    validations:
      required: true
