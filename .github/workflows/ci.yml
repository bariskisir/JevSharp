name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      package-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      PACKAGE_VERSION: ${{ inputs.package-version || format('0.0.0-ci.{0}', github.run_number) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/JevSharp.slnx
      - name: Verify formatting
        run: dotnet format src/JevSharp.slnx --verify-no-changes --no-restore
      - name: Verify source conventions and release tags
        run: |
          ./src/scripts/Check-Style.ps1
      - name: Build
        run: dotnet build src/JevSharp.slnx -c Release --no-restore -p:JevSharpPackageVersion=$env:PACKAGE_VERSION
      - name: Test
        run: dotnet test src/JevSharp.slnx -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - name: Verify NuGet packages and consumer
        run: ./src/scripts/Verify-Packages.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*nupkg
          if-no-files-found: error
